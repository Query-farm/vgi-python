name: CI

on:
  push:
    branches: [main]
    # README-only changes don't affect code, tests, or the mkdocs site
    # (which is built from docs/, not README.md), so skip the full CI for them.
    paths-ignore: ['README.md']
  pull_request:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

# Least-privilege default for all jobs — none need write access. (The release
# workflow grants id-token: write per-job for OIDC publishing; CI needs read.)
permissions:
  contents: read

env:
  # TODO(release-wave): same commit as the pyproject vgi-rpc pin. A built wheel
  # resolves vgi-rpc from PyPI (uv sources are not part of it), so the wheel jobs
  # install this commit alongside; drop it with the pin.
  VGI_RPC_PIN: "vgi-rpc @ git+https://github.com/Query-farm/vgi-rpc-python@1d40c513ebf4afa493437c34257951d76b39ce41"

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Bun for browser discovery regression tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  # The test job syncs --all-extras, whose dev extra pulls numpy in. That hid
  # the 0.51.0 bug where every filter evaluation needed numpy but neither engine
  # extra declared it. Here the built wheel gets only one user-facing extra.
  packaging:
    name: Wheel with only [${{ matrix.extra }}]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [haybarn, duckdb]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Build wheel
        run: uv build --wheel --out-dir dist .

      - name: Install the wheel with only [${{ matrix.extra }}]
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/venv"
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip install "$(ls dist/vgi_python-*.whl)[${{ matrix.extra }}]" "$VGI_RPC_PIN"

      - name: Evaluate pushed-down filters (plain and intersects_extent)
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/packaging/check_filter_evaluation.py"'

      - name: Evaluate an ordinary filter without numpy
        working-directory: ${{ runner.temp }}
        run: |
          VIRTUAL_ENV="$RUNNER_TEMP/venv" uv pip uninstall numpy
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/tests/packaging/check_filter_evaluation.py" --plain-only

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Check linting
        run: uv run ruff check .

      # Docstring consistency (pydoclint) runs inside the pytest suite via
      # tests/test_docstrings.py, so it's not a separate CI lint step.

      # ty was removed here in 0.25.2. It was already non-blocking, and at
      # 0.0.66 it stopped terminating on this tree at all -- `ty check vgi/`
      # ran past ten minutes and had to be killed. A signal nothing gates on,
      # that also burns a CI job's wall clock, is worse than no signal.
      - name: Type check (mypy)
        run: uv run mypy vgi/

      # tests/ became clean in 0.26.0 and is gated from here on. It was
      # unchecked for long enough to accumulate 174 errors; the point of the
      # gate is that it never gets to accumulate a second batch.
      - name: Type check tests (mypy)
        run: uv run mypy tests/

      # PROTOCOL_VERSIONS_V1 §8: the current protocol types against the latest
      # checked-in snapshot under schemas/. Additive changes pass; anything else
      # fails unless the protocol's major.minor was bumped.
      - name: Protocol schema compatibility
        run: uv run python -m vgi.codegen.protocol_schema_snapshot check

  docs:
    name: Docs (build + examples + prose)
    runs-on: ubuntu-latest
    env:
      DISABLE_MKDOCS_2_WARNING: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --group docs

      - name: Install d2
        run: curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Build docs (strict)
        run: uv run mkdocs build --strict

      - name: Test documentation examples
        run: uv run pytest tests/test_documentation_examples.py tests/test_examples_workers.py -q

      # Prose lint. Runs on every PR as a signal. Kept non-blocking for now:
      # the Google package + spelling check needs a vocabulary-tuning pass
      # against a real run before it can gate without false positives. Flip
      # fail_on_error to true (and drop continue-on-error) once the vocab in
      # .github/styles/config/vocabularies/VGI/accept.txt is settled.
      - name: Prose lint (Vale)
        uses: errata-ai/vale-action@v3
        continue-on-error: true
        with:
          files: docs
          fail_on_error: true

      - name: Link check (lychee)
        uses: lycheeverse/lychee-action@v2
        with:
          # --root-dir resolves root-relative links (e.g. <img src="/assets/...">,
          # which mkdocs serves from the site root = docs/) for offline checking.
          args: "--no-progress --offline --root-dir ${{ github.workspace }}/docs docs/**/*.md *.md"
          fail: true

  hosted-protocols:
    # vgi-rpc's cross-SDK hosted-protocols group: the fixture workers must host
    # vgi.v2 then conformance.Secondary.v1 on stdio, unix and HTTP, and pass the
    # Identity.v2 groups over HTTP (vgi-fixture-http --identity).
    name: Hosted-protocols conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --python 3.14

      - name: Run hosted-protocols group (stdio, unix, http)
        run: scripts/hosted_protocols_conformance.sh

  orchard-hosted-conformance:
    # The SDK-neutral Orchard hosted-mode harness (vgi test/hosted/), which
    # every SDK runs against its own fixture worker. vgi-python is the
    # reference, so it must pass here in full. Bump VGI_HOSTED_REF with the
    # harness.
    name: Orchard hosted-mode conformance
    runs-on: ubuntu-latest
    env:
      VGI_HOSTED_REF: fce57984a7e8ea35f9dcd4a034b5ed37c85ca5c5
    steps:
      - uses: actions/checkout@v7

      - name: Checkout the harness (vgi)
        uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi
          ref: ${{ env.VGI_HOSTED_REF }}
          path: vgi-upstream
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: test/hosted

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --all-extras --python 3.14

      - name: Run the hosted-mode harness
        run: VGI_DIR=vgi-upstream scripts/hosted_conformance.sh --log-dir hosted-conformance-logs

      - name: Upload worker logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-conformance-logs
          path: hosted-conformance-logs

  bare-install:
    # Every other job syncs --all-extras, which hides a core-dependency gap: a
    # worker that installs vgi-python with no extras must still import the
    # modules catalog_attach reaches (0.48.0 shipped without pycryptodome).
    name: Bare install (no extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Build wheel
        run: uv build --wheel --out-dir dist .

      - name: Import attach-path modules from the bare wheel
        run: |
          uv run --isolated --no-project --python 3.14 --with dist/*.whl --with "$VGI_RPC_PIN" \
            python -c "import vgi, vgi.worker, vgi.query_execution; print('ok')"

  direct-s3-rustfs:
    # VGI_STORAGE_BACKEND=s3 end to end: the HTTP fixture server keeps large
    # values in a RustFS bucket (SigV4-validating, the image vgi-rpc-java's
    # storage-integration job uses), over plain http + path style. Covers
    # backend selection, the startup bucket check, result externalization
    # and checksum=none. Skipped S3 cases fail the job.
    name: Direct S3 (RustFS)
    runs-on: ubuntu-latest
    env:
      RUSTFS_IMAGE: ghcr.io/rustfs/rustfs@sha256:29c02251c085cb04edce556304a9ec0f8fba0c40300266cf4f3d953783fe2450
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Start RustFS
        run: |
          docker run -d --name rustfs -p 127.0.0.1:9000:9000 -e RUSTFS_ACCESS_KEY=vgitestadmin \
            -e RUSTFS_SECRET_KEY=vgitestsecret123 -e RUSTFS_CONSOLE_ENABLE=false "$RUSTFS_IMAGE"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:9000/health >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:9000/health

      - name: Install dependencies
        run: uv sync --all-extras --python 3.14

      - name: Run direct-storage tests
        env:
          VGI_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          VGI_TEST_S3_ACCESS_KEY: vgitestadmin
          VGI_TEST_S3_SECRET_KEY: vgitestsecret123
        run: |
          set -o pipefail
          uv run --no-sync pytest -o addopts= -p no:cacheprovider -rs \
            tests/test_direct_storage.py tests/test_direct_storage_e2e.py 2>&1 | tee "$RUNNER_TEMP/pytest.out"
          if grep -E "^SKIPPED" "$RUNNER_TEMP/pytest.out"; then
            echo "::error::direct-storage tests skipped"; exit 1
          fi

      - name: RustFS logs
        if: failure()
        run: docker logs rustfs 2>&1 | tail -40

  s3-offload-localstack:
    name: S3 Offload Tests (LocalStack)
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.0
        ports:
          - 4566:4566
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7

      - name: Checkout vgi-rpc
        uses: actions/checkout@v7
        with:
          repository: Query-farm/vgi-rpc-python
          # The vgi-rpc commit pyproject pins (direct-storage contract, unreleased);
          # back to the released tag in the 3.4 release wave.
          ref: 1d40c513ebf4afa493437c34257951d76b39ce41
          path: vgi-rpc

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Install test dependencies
        run: |
          # Project env first (vgi + fixtures + dev tools), then overlay the
          # local vgi-rpc checkout with the s3/external extras plus boto3.
          # Subsequent uv run calls must pass --no-sync or uv re-syncs the
          # env to the lockfile and drops the overlay.
          uv sync --all-extras --python 3.14
          uv pip install './vgi-rpc[http,s3,external]' boto3

      - name: Create test bucket in LocalStack
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          uv run --no-sync python - <<'PY'
          import time
          import boto3
          from botocore.exceptions import EndpointConnectionError

          endpoint = "http://127.0.0.1:4566"
          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              aws_access_key_id="test",
              aws_secret_access_key="test",
              region_name="us-east-1",
          )

          for _ in range(30):
              try:
                  s3.list_buckets()
                  break
              except EndpointConnectionError:
                  time.sleep(1)
          else:
              raise RuntimeError("LocalStack S3 did not become ready in time")

          s3.create_bucket(Bucket="vgi-offload-test")
          PY

      - name: Run HTTP S3 offload tests
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
          VGI_RUN_S3_HTTP_TESTS: "1"
          VGI_HTTP_S3_BUCKET: vgi-offload-test
          VGI_HTTP_S3_ENDPOINT_URL: http://127.0.0.1:4566
          PYTHONPATH: ${{ github.workspace }}
        run: uv run --no-sync pytest tests/test_http_s3_offload_output.py tests/test_http_s3_offload_input.py -q
