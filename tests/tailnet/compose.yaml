name: vgi-python-tailnet

x-tailscale-kernel: &tailscale-kernel
  image: ${TAILSCALE_IMAGE:-tailscale/tailscale:stable}
  cap_add: [NET_ADMIN]
  devices: [/dev/net/tun:/dev/net/tun]
  restart: "no"

x-worker: &worker
  image: ${VGI_TAILNET_IMAGE:-vgi-python-tailnet:local}
  restart: "no"

services:
  tailscale-server:
    <<: *tailscale-kernel
    hostname: ${TAILNET_SERVER_HOSTNAME:-vgi-python-ci-server}
    environment:
      TS_CLIENT_ID: ${TS_SERVER_OAUTH_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_SERVER_OAUTH_SECRET:-}?preauthorized=true
      TS_HOSTNAME: ${TAILNET_SERVER_HOSTNAME:-vgi-python-ci-server}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --accept-dns=true --advertise-tags=tag:vgi-ci-server
    volumes:
      - server-state:/var/lib/tailscale
      - server-socket:/var/run/tailscale
    healthcheck:
      test: [CMD, tailscale, --socket=/var/run/tailscale/tailscaled.sock, status, --json]
      interval: 2s
      timeout: 2s
      retries: 30

  tailscale-client:
    <<: *tailscale-kernel
    hostname: ${TAILNET_CLIENT_HOSTNAME:-vgi-python-ci-client}
    environment:
      TS_CLIENT_ID: ${TS_OAUTH_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_OAUTH_SECRET:-}?preauthorized=true
      TS_HOSTNAME: ${TAILNET_CLIENT_HOSTNAME:-vgi-python-ci-client}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: --accept-dns=true --advertise-tags=${TAILNET_EXPECTED_CLIENT_TAG:-tag:vgi-ci-client}
    volumes:
      - client-state:/var/lib/tailscale
      - client-socket:/var/run/tailscale
    healthcheck:
      test: [CMD, tailscale, --socket=/var/run/tailscale/tailscaled.sock, status, --json]
      interval: 2s
      timeout: 2s
      retries: 30

  tailscale-socks:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:stable}
    hostname: ${TAILNET_SOCKS_HOSTNAME:-vgi-python-ci-socks}
    environment:
      TS_CLIENT_ID: ${TS_OAUTH_CLIENT_ID:-}
      TS_CLIENT_SECRET: ${TS_OAUTH_SECRET:-}?preauthorized=true
      TS_HOSTNAME: ${TAILNET_SOCKS_HOSTNAME:-vgi-python-ci-socks}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_SOCKS5_SERVER: :1055
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_EXTRA_ARGS: --advertise-tags=${TAILNET_EXPECTED_CLIENT_TAG:-tag:vgi-ci-client}
    volumes:
      - socks-state:/var/lib/tailscale
      - socks-socket:/var/run/tailscale
    healthcheck:
      test: [CMD, tailscale, --socket=/var/run/tailscale/tailscaled.sock, status, --json]
      interval: 2s
      timeout: 2s
      retries: 30

  worker-direct:
    <<: *worker
    network_mode: service:tailscale-server
    depends_on:
      tailscale-server: {condition: service_healthy}
    volumes:
      - server-socket:/var/run/tailscale:ro
    command:
      - python
      - -m
      - tests.tailnet.worker
      - --issuer
      - ${TAILNET_ISSUER:-tailnet:vgi-ci}
      - --required-capability
      - ${TAILNET_EXPECTED_CAPABILITY:-query.farm/cap/vgi-test}
      - --required-tag
      - ${TAILNET_EXPECTED_CLIENT_TAG:-tag:vgi-ci-client}
      - tcp
      - --host
      - 0.0.0.0
      - --port
      - "19400"
      - --localapi-socket
      - /var/run/tailscale/tailscaled.sock
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 19400), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker-http:
    <<: *worker
    network_mode: service:tailscale-server
    depends_on:
      tailscale-server: {condition: service_healthy}
    command:
      - python
      - -m
      - tests.tailnet.worker
      - --issuer
      - ${TAILNET_ISSUER:-tailnet:vgi-ci}
      - --required-capability
      - ${TAILNET_EXPECTED_CAPABILITY:-query.farm/cap/vgi-test}
      - http
      - --host
      - 127.0.0.1
      - --port
      - "18080"
      - --trusted-proxy-address
      - 127.0.0.1
      - --trusted-proxy-address
      - ::1
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 18080), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 30

  worker-http-direct:
    <<: *worker
    network_mode: service:tailscale-server
    depends_on:
      tailscale-server: {condition: service_healthy}
    volumes:
      - server-socket:/var/run/tailscale:ro
    command:
      - python
      - -m
      - tests.tailnet.worker
      - --issuer
      - ${TAILNET_ISSUER:-tailnet:vgi-ci}
      - --required-capability
      - ${TAILNET_EXPECTED_CAPABILITY:-query.farm/cap/vgi-test}
      - --required-tag
      - ${TAILNET_EXPECTED_CLIENT_TAG:-tag:vgi-ci-client}
      - http
      - --host
      - 0.0.0.0
      - --port
      - "18081"
      - --localapi-socket
      - /var/run/tailscale/tailscaled.sock
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1', 18081), 1).close()"]
      interval: 2s
      timeout: 2s
      retries: 30

  probe-direct:
    <<: *worker
    profiles: [tools]
    network_mode: service:tailscale-client
    depends_on:
      tailscale-client: {condition: service_healthy}

  probe-socks:
    <<: *worker
    profiles: [tools]
    depends_on:
      tailscale-socks: {condition: service_healthy}

volumes:
  server-state:
  server-socket:
  client-state:
  client-socket:
  socks-state:
  socks-socket:
